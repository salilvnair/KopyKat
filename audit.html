<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KopyKat — Audit Log</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="audit.css" />
</head>
<body>
  <div class="page">
    <div class="panel">
      <header class="panel-header">
        <div class="logo">
          <svg viewBox="34 26 60 60" fill="none" aria-hidden="true">
            <path fill="#fff" fill-rule="evenodd" d="M40 54 L45 30 L60 48 A24 22 0 0 1 68 48 L83 30 L88 54 A25 27 0 0 1 40 54 Z M51.4 60 A4.6 4.6 0 1 0 60.6 60 A4.6 4.6 0 1 0 51.4 60 Z M67.4 60 A4.6 4.6 0 1 0 76.6 60 A4.6 4.6 0 1 0 67.4 60 Z M60 69 h8 l-4 5 z"/>
          </svg>
        </div>
        <div class="head-titles">
          <h1>Audit Log</h1>
          <p class="subtitle">What synced, from which tab, to which tab</p>
        </div>
        <span class="count-pill" id="eventCount">0 events</span>
        <button id="themeToggle" class="btn-icon" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="toolbar">
        <div class="toolbar-actions">
          <button id="syncTabs" class="btn-ghost">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-.7 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 5v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="syncTabsLabel">Sync tabs</span>
          </button>
          <button id="exportBtn" class="btn-ghost">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12M8 11l4 4 4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export
          </button>
          <button id="importBtn" class="btn-ghost">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V3M8 7l4-4 4 4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Import
          </button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
          <button id="clearKeys" class="btn-danger">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Clear keys everywhere
          </button>
          <span class="grow"></span>
          <button id="clear" class="btn-ghost">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Clear log
          </button>
        </div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="search" placeholder="Filter by key, origin, or value…" />
        </div>
      </div>

      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr><th>Time</th><th>Key</th><th>From</th><th>To</th><th>Value</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div id="empty" class="empty-state" style="display:none;">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </div>
        <p id="emptyText">No sync events recorded yet.</p>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="warn-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 2 20h20L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <h3 id="modalTitle">Clear synced keys everywhere?</h3>
      <p id="modalBody">This removes the synced keys from every mapped tab right now. Each app will be signed out until it sets the value again.</p>
      <div class="targets" id="modalTargets"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelModal">Cancel</button>
        <button class="btn-danger solid" id="confirmModal">Clear everywhere</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="audit.js"></script>
</body>
</html>
